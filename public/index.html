<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Incident Hub</title>
    <style>
      body{font-family:Arial,Helvetica,sans-serif;margin:20px}
      .inc{border:1px solid #ddd;padding:8px;margin:6px}
      label{display:block;margin-top:8px}
    </style>
  </head>
  <body>
    <h1>Incident Hub</h1>
    <section id="dashboard"></section>

    <h2>Create Incident</h2>
    <form id="createForm">
      <label>Title<input name="title" required /></label>
      <label>Description<textarea name="description" required></textarea></label>
      <label>Severity
        <select name="severity">
          <option>Low</option>
          <option>Medium</option>
          <option>High</option>
          <option>Critical</option>
        </select>
      </label>
      <label>Owner<input name="owner" required /></label>
      <button>Create</button>
    </form>

    <h2>Incidents</h2>
    <label>Filter: <select id="filterStatus"><option value="">All</option><option>Open</option><option>In Progress</option><option>Resolved</option></select>
    <select id="filterSeverity"><option value="">All</option><option>Low</option><option>Medium</option><option>High</option><option>Critical</option></select>
    <button id="refresh">Refresh</button></label>
    <div id="list"></div>

    <div id="detail" style="margin-top:20px"></div>

    <script src="/app.js"></script>
  </body>
</html>
